! Edge router - the client side of the lab ("the internet").
! Learns the anycast VIPs from each data center's BGP speaker:
!   10.99.0.10/32 (writes, follows the primary) and 10.99.0.11/32 (reads).
frr defaults traditional
hostname edge
log stdout informational
!
ip prefix-list VIP seq 10 permit 10.99.0.10/32
ip prefix-list VIP seq 20 permit 10.99.0.11/32
route-map FROM-DC permit 10
 match ip address prefix-list VIP
! The edge only listens: it never advertises anything back into the data centers.
route-map NOTHING deny 10
!
router bgp 65000
 bgp router-id 10.210.0.2
 no bgp ebgp-requires-policy
 ! Compare MED between different data centers (different ASes): the DC holding
 ! the primary announces a lower MED and wins.
 bgp always-compare-med
 timers bgp 3 9
 neighbor 10.210.0.11 remote-as 65001
 neighbor 10.210.0.11 description bgp-a (DC-A)
 neighbor 10.210.0.12 remote-as 65002
 neighbor 10.210.0.12 description bgp-b (DC-B)
 address-family ipv4 unicast
  neighbor 10.210.0.11 route-map FROM-DC in
  neighbor 10.210.0.11 route-map NOTHING out
  neighbor 10.210.0.12 route-map FROM-DC in
  neighbor 10.210.0.12 route-map NOTHING out
 exit-address-family
!
