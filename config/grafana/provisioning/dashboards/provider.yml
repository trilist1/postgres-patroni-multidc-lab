apiVersion: 1
providers:
  - name: "default"
    orgId: 1
    folder: "PostgreSQL HA"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10   # poll: file events don't cross the Windows bind mount
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
