# Shared by haproxy-a (DC-A) and haproxy-b (DC-B): identical configuration in
# both data centers. Each one routes writes to whichever node is primary, wherever it is.
global
    maxconn 2000
    log stdout format raw local0

defaults
    mode tcp
    log global
    retries 3
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout check 5s
    maxconn 1000

# Docker embedded DNS: start before the Patroni containers exist and follow IP changes.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth admin:HaproxyStats2026

listen postgresql_write
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server patroni1 patroni1:5432 maxconn 200 check port 8008
    server patroni2 patroni2:5432 maxconn 200 check port 8008
    server patroni3 patroni3:5432 maxconn 200 check port 8008

# Reads: replicas first. If no replica is healthy (e.g. a whole DC is down and only
# the primary is left), fall back to any node that can serve reads, i.e. the primary.
frontend postgresql_read
    bind *:5001
    use_backend postgresql_replicas if { nbsrv(postgresql_replicas) gt 0 }
    default_backend postgresql_read_any

backend postgresql_replicas
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server patroni1 patroni1:5432 maxconn 200 check port 8008
    server patroni2 patroni2:5432 maxconn 200 check port 8008
    server patroni3 patroni3:5432 maxconn 200 check port 8008

backend postgresql_read_any
    balance roundrobin
    option httpchk GET /read-only
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server patroni1 patroni1:5432 maxconn 200 check port 8008
    server patroni2 patroni2:5432 maxconn 200 check port 8008
    server patroni3 patroni3:5432 maxconn 200 check port 8008
