global
    maxconn 2000
    log stdout format raw local0

defaults
    mode tcp
    log global
    retries 3
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout check 5s
    maxconn 1000

# Docker embedded DNS: lets HAProxy start before the Patroni containers
# exist and follow their IPs if they are recreated.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth admin:HaproxyStats2026

listen postgresql_write
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server patroni1 patroni1:5432 maxconn 200 check port 8008
    server patroni2 patroni2:5432 maxconn 200 check port 8008
    server patroni3 patroni3:5432 maxconn 200 check port 8008

listen postgresql_read
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server patroni1 patroni1:5432 maxconn 200 check port 8008
    server patroni2 patroni2:5432 maxconn 200 check port 8008
    server patroni3 patroni3:5432 maxconn 200 check port 8008
