global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "patroni"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "patroni1:8008"
          - "patroni2:8008"
          - "patroni3:8008"
        labels:
          cluster: "pg-ha-cluster"

  # Job name "postgres" matches what standard Grafana community
  # dashboards expect (e.g. dashboards 9628, 455, 12273, 14114).
  # relabel_configs rewrites the instance label from the exporter
  # address (pg-exporter1:9187) to the actual PG server
  # (patroni1:5432) so standard dashboard variables work.
  - job_name: "postgres"
    scrape_interval: 15s
    static_configs:
      - targets: ["pg-exporter1:9187"]
        labels:
          cluster: "pg-ha-cluster"
          pg_node: "patroni1"
      - targets: ["pg-exporter2:9187"]
        labels:
          cluster: "pg-ha-cluster"
          pg_node: "patroni2"
      - targets: ["pg-exporter3:9187"]
        labels:
          cluster: "pg-ha-cluster"
          pg_node: "patroni3"
    relabel_configs:
      - source_labels: [pg_node]
        target_label: instance
        regex: (.+)
        replacement: ${1}:5432

  - job_name: "etcd"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "etcd1:2379"
          - "etcd2:2379"
          - "etcd3:2379"
