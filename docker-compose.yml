services:

  # --- ETCD CLUSTER (3 nodes) ---
  etcd1:
    image: gcr.io/etcd-development/etcd:v3.7.2
    container_name: etcd1
    restart: unless-stopped
    ports:
      - "2379:2379"
    volumes:
      - D:\Software\Containers\PostgresPatroni\Claude\etcd-data\etcd1:/etcd-data
    command: ["/usr/local/bin/etcd", "--name=etcd1", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd1:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd1:2380", "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380", "--initial-cluster-token=patroni-etcd-token", "--initial-cluster-state=new", "--logger=zap", "--log-level=info"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd2:
    image: gcr.io/etcd-development/etcd:v3.7.2
    container_name: etcd2
    restart: unless-stopped
    ports:
      - "2381:2379"
    volumes:
      - D:\Software\Containers\PostgresPatroni\Claude\etcd-data\etcd2:/etcd-data
    command: ["/usr/local/bin/etcd", "--name=etcd2", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd2:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd2:2380", "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380", "--initial-cluster-token=patroni-etcd-token", "--initial-cluster-state=new", "--logger=zap", "--log-level=info"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd3:
    image: gcr.io/etcd-development/etcd:v3.7.2
    container_name: etcd3
    restart: unless-stopped
    ports:
      - "2383:2379"
    volumes:
      - D:\Software\Containers\PostgresPatroni\Claude\etcd-data\etcd3:/etcd-data
    command: ["/usr/local/bin/etcd", "--name=etcd3", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd3:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd3:2380", "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380", "--initial-cluster-token=patroni-etcd-token", "--initial-cluster-state=new", "--logger=zap", "--log-level=info"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- PATRONI / POSTGRESQL (3 nodes) ---
  patroni1:
    image: patroni-pg18:4.1.5
    container_name: patroni1
    hostname: patroni1
    restart: unless-stopped
    ports:
      - "5433:5432"
      - "8008:8008"
    volumes:
      - D:\Software\Containers\PostgresPatroni\Claude\pgdata\patroni1:/var/lib/postgresql/data
      - D:\Software\Containers\PostgresPatroni\Claude\config\patroni1.yml:/etc/patroni/patroni.yml:ro
      - D:\Software\Containers\PostgresPatroni\Claude\certs:/etc/patroni/certs:ro
    environment:
      - PATRONI_NAME=patroni1
      - ETCD_HOSTS=etcd1:2379,etcd2:2379,etcd3:2379
    depends_on:
      etcd1: { condition: service_healthy }
      etcd2: { condition: service_healthy }
      etcd3: { condition: service_healthy }

  patroni2:
    image: patroni-pg18:4.1.5
    container_name: patroni2
    hostname: patroni2
    restart: unless-stopped
    ports:
      - "5434:5432"
      - "8009:8008"
    volumes:
      - D:\Software\Containers\PostgresPatroni\Claude\pgdata\patroni2:/var/lib/postgresql/data
      - D:\Software\Containers\PostgresPatroni\Claude\config\patroni2.yml:/etc/patroni/patroni.yml:ro
      - D:\Software\Containers\PostgresPatroni\Claude\certs:/etc/patroni/certs:ro
    environment:
      - PATRONI_NAME=patroni2
      - ETCD_HOSTS=etcd1:2379,etcd2:2379,etcd3:2379
    depends_on:
      etcd1: { condition: service_healthy }
      etcd2: { condition: service_healthy }
      etcd3: { condition: service_healthy }

  patroni3:
    image: patroni-pg18:4.1.5
    container_name: patroni3
    hostname: patroni3
    restart: unless-stopped
    ports:
      - "5435:5432"
      - "8010:8008"
    volumes:
      - D:\Software\Containers\PostgresPatroni\Claude\pgdata\patroni3:/var/lib/postgresql/data
      - D:\Software\Containers\PostgresPatroni\Claude\config\patroni3.yml:/etc/patroni/patroni.yml:ro
      - D:\Software\Containers\PostgresPatroni\Claude\certs:/etc/patroni/certs:ro
    environment:
      - PATRONI_NAME=patroni3
      - ETCD_HOSTS=etcd1:2379,etcd2:2379,etcd3:2379
    depends_on:
      etcd1: { condition: service_healthy }
      etcd2: { condition: service_healthy }
      etcd3: { condition: service_healthy }

  # --- HAPROXY ---
  haproxy:
    image: haproxy:3.4.6
    container_name: haproxy
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
      - "7000:7000"
    volumes:
      - D:\Software\Containers\PostgresPatroni\Claude\config\haproxy\haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - patroni1
      - patroni2
      - patroni3

  # --- POSTGRES EXPORTERS (one per PG node, default metrics only) ---
  # No custom queries - built-in collectors only (--extend.query-path and
  # --auto-discover-databases are deprecated upstream). Extra collectors:
  # stat_checkpointer (PG17+ checkpoint stats), stat_statements, long_running_transactions.
  pg-exporter1:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: pg-exporter1
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:SuperSecret2026@patroni1:5432/postgres?sslmode=disable
    command: ["--collector.stat_checkpointer", "--collector.stat_statements", "--collector.long_running_transactions"]
    depends_on:
      - patroni1

  pg-exporter2:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: pg-exporter2
    restart: unless-stopped
    ports:
      - "9188:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:SuperSecret2026@patroni2:5432/postgres?sslmode=disable
    command: ["--collector.stat_checkpointer", "--collector.stat_statements", "--collector.long_running_transactions"]
    depends_on:
      - patroni2

  pg-exporter3:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: pg-exporter3
    restart: unless-stopped
    ports:
      - "9189:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:SuperSecret2026@patroni3:5432/postgres?sslmode=disable
    command: ["--collector.stat_checkpointer", "--collector.stat_statements", "--collector.long_running_transactions"]
    depends_on:
      - patroni3

  # --- MONITORING ---
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - D:\Software\Containers\PostgresPatroni\Claude\config\prometheus\prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - D:\Software\Containers\PostgresPatroni\Claude\prometheus-data:/prometheus
    depends_on:
      - pg-exporter1

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=GrafanaAdmin2026
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/pg-ha-cluster.json
    volumes:
      - D:\Software\Containers\PostgresPatroni\Claude\config\grafana\provisioning:/etc/grafana/provisioning:ro
      - D:\Software\Containers\PostgresPatroni\Claude\config\grafana\dashboards:/var/lib/grafana/dashboards:ro
      - D:\Software\Containers\PostgresPatroni\Claude\grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # --- LANDING PAGE (topology, live status, config viewer) ---
  # Stdlib-only Python app from landing\. Probes every service over the
  # compose network and serves their configs (mounted read-only).
  landing:
    image: python:3.15.0-slim
    container_name: landing
    restart: unless-stopped
    ports:
      - "9090:8080"
    environment:
      - HAPROXY_STATS_AUTH=admin:HaproxyStats2026
    volumes:
      - D:\Software\Containers\PostgresPatroni\Claude\landing:/app:ro
      - D:\Software\Containers\PostgresPatroni\Claude\config:/srv/config:ro
      - D:\Software\Containers\PostgresPatroni\Claude\patroni-image:/srv/patroni-image:ro
      - D:\Software\Containers\PostgresPatroni\Claude\docker-compose.yml:/srv/docker-compose.yml:ro
    command: ["python", "-u", "/app/server.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - haproxy
      - prometheus
